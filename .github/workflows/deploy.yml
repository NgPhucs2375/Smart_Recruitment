# HireAI CI/CD — GCP VM (Docker Compose + Nginx).
# CI chạy mọi push/PR. CD (SSH deploy) chỉ khi push vào nhánh main.

name: CI/CD — GCP VM

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------- Stage 1a: Frontend typecheck + lint (Node 22) ----------
  frontend-ci:
    name: Frontend CI (tsc + eslint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/WebApi/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/WebApi/frontend/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint . --max-warnings=0

  # ---------- Stage 1b: Backend build (.NET 10) ----------
  backend-ci:
    name: Backend CI (dotnet build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - run: dotnet build RecruitmentSmart.sln -c Release --nologo -v minimal
        working-directory: .

  # ---------- Stage 2: Build and publish immutable images on GitHub ----------
  build-images:
    name: Build and push Docker images
    needs: [frontend-ci, backend-ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Validate frontend build variables
        env:
          HIREAI_GOOGLE_CLIENT_ID: ${{ vars.HIREAI_GOOGLE_CLIENT_ID }}
          HIREAI_GITHUB_CLIENT_ID: ${{ vars.HIREAI_GITHUB_CLIENT_ID }}
        run: |
          test -n "$HIREAI_GOOGLE_CLIENT_ID" || { echo "Missing Actions variable HIREAI_GOOGLE_CLIENT_ID" >&2; exit 1; }
          test -n "$HIREAI_GITHUB_CLIENT_ID" || { echo "Missing Actions variable HIREAI_GITHUB_CLIENT_ID" >&2; exit 1; }

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/WebApi/WebApp.Server/Dockerfile
          push: true
          tags: ghcr.io/ngphucs2375/hireai-backend:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=hireai-backend
          cache-to: type=gha,scope=hireai-backend,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: src/WebApi/frontend
          file: src/WebApi/frontend/Dockerfile
          push: true
          tags: ghcr.io/ngphucs2375/hireai-frontend:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ vars.HIREAI_GOOGLE_CLIENT_ID }}
            NEXT_PUBLIC_GITHUB_CLIENT_ID=${{ vars.HIREAI_GITHUB_CLIENT_ID }}
            NEXT_PUBLIC_COPILOTKIT_THREADS_ENABLED=${{ vars.HIREAI_COPILOTKIT_THREADS_ENABLED }}
          cache-from: type=gha,scope=hireai-frontend
          cache-to: type=gha,scope=hireai-frontend,mode=max

  # ---------- Stage 3: Pull images and deploy on GCP VM ----------
  deploy-prod:
    name: Deploy to GCP VM
    needs: [build-images]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: appleboy/ssh-action@v1.2.2
        env:
          IMAGE_TAG: ${{ github.sha }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.GCP_VM_HOST }}
          username: ${{ secrets.GCP_VM_USER }}
          key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          envs: IMAGE_TAG,GHCR_USERNAME,GHCR_TOKEN
          command_timeout: 30m
          script: |
            set -e
            : "${IMAGE_TAG:?Missing image tag}"
            : "${GHCR_TOKEN:?Missing GHCR token}"
            export IMAGE_TAG
            cleanup_registry_login() { docker logout ghcr.io >/dev/null 2>&1 || true; }
            trap cleanup_registry_login EXIT
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin

            APP_DIR=/home/${{ secrets.GCP_VM_USER }}/hireai
            if [ ! -d "$APP_DIR/.git" ]; then
              # Dùng GITHUB_TOKEN nên clone được cả repo private.
              git clone "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" "$APP_DIR"
            fi
            cd "$APP_DIR"
            git fetch origin main
            git reset --hard origin/main
            if [ ! -f .env.prod ]; then
              echo "THIEU .env.prod tren VM (xem deploy/README.md muc 3). Abort."
              exit 1
            fi
            docker compose --env-file .env.prod -f docker-compose.prod.yml pull backend frontend
            docker logout ghcr.io >/dev/null 2>&1 || true
            trap - EXIT
            docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --no-build --remove-orphans
            docker compose --env-file .env.prod -f docker-compose.prod.yml ps
            # Frontend Next.js can take longer than 15 seconds to accept requests
            # after its container starts. Probe through the local Nginx HTTPS route
            # (frontend:3000 is internal to the Docker network, not host-published).
            for attempt in $(seq 1 30); do
              if curl -fsS --resolve hireais.dev:443:127.0.0.1 https://hireais.dev/ -o /dev/null 2>&1; then
                echo "Frontend health check OK"
                break
              fi
              if [ "$attempt" -eq 30 ]; then
                echo "Frontend did not become healthy after 150 seconds" >&2
                docker compose --env-file .env.prod -f docker-compose.prod.yml ps
                exit 1
              fi
              sleep 5
            done
            docker system prune -f
            echo "DEPLOY OK: $(git rev-parse --short HEAD)"
