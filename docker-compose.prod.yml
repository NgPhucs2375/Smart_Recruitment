# HireAI PRODUCTION — GCP VM (Docker Compose).
# Chạy: docker compose -f docker-compose.prod.yml up -d --build
# Secrets 100% qua environment (.env.prod, KHÔNG commit). Mẫu xem deploy/README.md.
#
# Lưu ý kiến trúc:
# - Backend nghe 8080 nội bộ (Program.cs fallback). Nginx route TẤT CẢ về
#   frontend:3000; frontend proxy server-side tới http://backend:8080.
# - MinIO mở 9000 (+console 9001) ra host cho presigned URL trình duyệt.
#   Chưa TLS (không domain) -> Minio__UseSSL=false. Khi gắn domain + 443,
#   xem lại MinIO trong deploy/README.md (HTTP trên trang HTTPS bị chặn).

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: hireai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: smart_recruitment_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"

    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smart_recruitment_db"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - hireai_network

  redis:
    image: redis:7-alpine
    container_name: hireai-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - hireai_network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: hireai-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER:?RABBITMQ_USER is required}"

      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}"

    networks:
      - hireai_network

  minio:
    image: quay.io/minio/minio:latest
    container_name: hireai-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}"

      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}"

    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - hireai_network

  backend:
    build:
      context: .
      dockerfile: src/WebApi/WebApp.Server/Dockerfile
    container_name: hireai-backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080

      ConnectionStrings__PostgresConnection: Host=postgres;Port=5432;Database=smart_recruitment_db;Username=postgres;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      ConnectionStrings__Redis: redis:6379,abortConnect=false

      JWTSettings__Key: "${JWT_KEY:?JWT_KEY is required}"

      JWTSettings__Issuer: "${JWT_ISSUER:-Identity}"

      JWTSettings__Audience: "${JWT_AUDIENCE:-IdentityUser}"

      JWTSettings__DurationInMinutes: "${JWT_DURATION:-60}"


      GoogleSettings__ClientId: "${GOOGLE_CLIENT_ID:-}"


      Gemini__ApiKey: "${GEMINI_API_KEY:-}"
      Gemini__Endpoint: "${GEMINI_ENDPOINT:-https://generativelanguage.googleapis.com/v1beta/openai/}"
      Gemini__Model: "${GEMINI_MODEL:-gemini-3.6-flash-lite}"


      MailSettings__SmtpHost: "${MAIL_SMTP_HOST:-}"

      MailSettings__SmtpPort: "${MAIL_SMTP_PORT:-587}"

      MailSettings__SmtpUser: "${MAIL_USER:-}"

      MailSettings__SmtpPass: "${MAIL_PASS:-}"

      MailSettings__EmailFrom: "${MAIL_FROM:-}"

      MailSettings__DisplayName: "${MAIL_DISPLAY_NAME:-HireAI}"


      Minio__Endpoint: minio:9000
      Minio__PublicEndpoint: "${MINIO_PUBLIC_ENDPOINT:?MINIO_PUBLIC_ENDPOINT is required (vd: http://<IP-VM>:9000)}"

      Minio__AccessKey: "${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}"

      Minio__SecretKey: "${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}"

      Minio__BucketName: smart-recruitment-files
      Minio__UseSSL: "false"

      RabbitMq__HostName: rabbitmq
      RabbitMq__UserName: "${RABBITMQ_USER:?RABBITMQ_USER is required}"

      RabbitMq__Password: "${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}"

      RabbitMq__Port: "5672"
      RabbitMq__VHost: ""

      Frontend__AllowedOrigins: "${FRONTEND_ALLOWED_ORIGINS:?FRONTEND_ALLOWED_ORIGINS is required (vd: http://<IP-VM>)}"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      minio:
        condition: service_started
    networks:
      - hireai_network

  frontend:
    build:
      context: ./src/WebApi/frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"

        NEXT_PUBLIC_COPILOTKIT_THREADS_ENABLED: "${COPILOTKIT_THREADS_ENABLED:-}"

    container_name: hireai-frontend
    restart: unless-stopped
    environment:
      DOTNET_API_URL: http://backend:8080
      DOTNET_AGENT_URL: http://backend:8080/api/copilotkit
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      - backend
    networks:
      - hireai_network

  nginx:
    image: nginx:alpine
    container_name: hireai-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Khi có certs (Certbot webroot): bỏ comment 2 dòng dưới.
      # - ./deploy/nginx/certs:/etc/nginx/certs:ro
      # - certbot-www:/var/www/certbot:ro
    depends_on:
      - frontend
    networks:
      - hireai_network

volumes:
  postgres_data:
  minio_data:
  # certbot-www:

networks:
  hireai_network:
    driver: bridge
