# Prod override cho Render / production.
# Dùng: docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build
# Dev mặc định (docker-compose.yml) dùng Dockerfile.dev + volumes + port 3001.
services:
  backend:
    build:
      dockerfile: src/WebApi/WebApp.Server/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Ai__Endpoint: http://host.docker.internal:20128/v1
      Ai__Model: Ahihi
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
        NEXT_PUBLIC_COPILOTKIT_THREADS_ENABLED: ${NEXT_PUBLIC_COPILOTKIT_THREADS_ENABLED:-}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes: []
