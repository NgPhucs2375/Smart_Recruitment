# HireAI PRODUCTION — GCP VM (Docker Compose).
# Chạy: docker compose -f docker-compose.prod.yml up -d --build
# Secrets 100% qua environment (.env.prod, KHÔNG commit). Mẫu xem deploy/README.md.
#
# Lưu ý kiến trúc:
# - Backend nghe 8080 nội bộ (Program.cs fallback). Nginx route TẤT CẢ về
#   frontend:3000; frontend proxy server-side tới http://backend:8080.
# - Presigned URL mà trình duyệt mở = https://hireais.dev/<bucket>/<object>?X-Amz-*,
#   nginx forward path đó vào minio:9000 (xem deploy/nginx/nginx.conf), nên không cần
#   mở cổng 9000 ra internet. Minio__UseSSL chỉ áp cho client NỘI BỘ backend->MinIO
#   (vẫn http trong docker network); TLS của URL public lấy từ scheme của
#   MINIO_PUBLIC_ENDPOINT. Cổng 9001 còn lại cho console admin.

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: hireai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: smart_recruitment_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"

    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smart_recruitment_db"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - hireai_network

  redis:
    image: redis:7-alpine
    container_name: hireai-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - hireai_network

  minio:
    # MinIO khong con publish image public (Docker Hub 404, quay.io 401).
    # RustFS noi S3 API nen MinIO SDK cua backend van dung.
    image: rustfs/rustfs:latest
    container_name: hireai-minio
    restart: unless-stopped
    depends_on:
      minio-volume-permission:
        condition: service_completed_successfully
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: "${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}"
      RUSTFS_SECRET_KEY: "${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}"
      RUSTFS_OBS_LOGGER_LEVEL: info
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - hireai_network

  minio-volume-permission:
    image: alpine:3.22
    restart: "no"
    volumes:
      - minio_data:/data
    command: sh -c "chown -R 10001:10001 /data"
    networks:
      - hireai_network

  minio-init:
    image: amazon/aws-cli:2.37.7
    restart: "no"
    depends_on:
      minio:
        condition: service_started
    environment:
      AWS_ACCESS_KEY_ID: "${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}"
      AWS_SECRET_ACCESS_KEY: "${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}"
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        for attempt in $(seq 1 30); do
          if aws s3api head-bucket --bucket "smart-recruitment-files" --endpoint-url http://minio:9000 >/dev/null 2>&1; then
            echo "Object-storage bucket is ready: smart-recruitment-files"
            exit 0
          fi
          if aws s3api create-bucket --bucket "smart-recruitment-files" --endpoint-url http://minio:9000 >/dev/null 2>&1; then
            echo "Created object-storage bucket: smart-recruitment-files"
            exit 0
          fi
          sleep 2
        done
        echo "Could not connect to object storage or create bucket: smart-recruitment-files" >&2
        exit 1
    networks:
      - hireai_network

  backend:
    build:
      context: .
      dockerfile: src/WebApi/WebApp.Server/Dockerfile
    container_name: hireai-backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080

      ConnectionStrings__PostgresConnection: Host=postgres;Port=5432;Database=smart_recruitment_db;Username=postgres;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      ConnectionStrings__Redis: redis:6379,abortConnect=false

      JWTSettings__Key: "${JWT_KEY:?JWT_KEY is required}"

      JWTSettings__Issuer: "${JWT_ISSUER:-Identity}"

      JWTSettings__Audience: "${JWT_AUDIENCE:-IdentityUser}"

      JWTSettings__DurationInMinutes: "${JWT_DURATION:-60}"


      GoogleSettings__ClientId: "${GOOGLE_CLIENT_ID:-}"

      # GitHub login (tùy chọn): để trống thì nút báo "chưa được cấu hình" — chủ ý.
      # Secret chỉ nằm ở server (AccountService.ExchangeGitHubCodeAsync), client
      # chỉ cần ClientId để làm build arg NEXT_PUBLIC_*.
      GitHubSettings__ClientId: "${GITHUB_CLIENT_ID:-}"
      GitHubSettings__ClientSecret: "${GITHUB_CLIENT_SECRET:-}"


      Gemini__ApiKey: "${GEMINI_API_KEY:-}"
      Gemini__Endpoint: "${GEMINI_ENDPOINT:-https://generativelanguage.googleapis.com/v1beta/openai/}"
      Gemini__Model: "${GEMINI_MODEL:-gemini-3.6-flash-lite}"


      MailSettings__SmtpHost: "${MAIL_SMTP_HOST:-}"

      MailSettings__SmtpPort: "${MAIL_SMTP_PORT:-587}"

      MailSettings__SmtpUser: "${MAIL_USER:-}"

      MailSettings__SmtpPass: "${MAIL_PASS:-}"

      MailSettings__EmailFrom: "${MAIL_FROM:-}"

      MailSettings__DisplayName: "${MAIL_DISPLAY_NAME:-HireAI}"


      Minio__Endpoint: minio:9000
      Minio__PublicEndpoint: "${MINIO_PUBLIC_ENDPOINT:?MINIO_PUBLIC_ENDPOINT is required (vd: https://hireais.dev)}"

      Minio__AccessKey: "${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}"

      Minio__SecretKey: "${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}"

      Minio__BucketName: smart-recruitment-files
      # Client nội bộ backend->MinIO; presigned URL public bật TLS theo scheme
      # của MINIO_PUBLIC_ENDPOINT (MinioFileStorageService.CreatePresignedUrlAsync).
      Minio__UseSSL: "false"

      Frontend__AllowedOrigins: "${FRONTEND_ALLOWED_ORIGINS:?FRONTEND_ALLOWED_ORIGINS is required (vd: https://hireais.dev)}"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - hireai_network

  frontend:
    build:
      context: ./src/WebApi/frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"

        NEXT_PUBLIC_GITHUB_CLIENT_ID: "${GITHUB_CLIENT_ID:-}"

        NEXT_PUBLIC_COPILOTKIT_THREADS_ENABLED: "${COPILOTKIT_THREADS_ENABLED:-}"

    container_name: hireai-frontend
    restart: unless-stopped
    environment:
      DOTNET_API_URL: http://backend:8080
      DOTNET_AGENT_URL: http://backend:8080/api/copilotkit
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      - backend
    networks:
      - hireai_network

  nginx:
    image: nginx:alpine
    container_name: hireai-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Certbot chạy trên host; mount cả /etc/letsencrypt vì live/ là symlink sang archive/.
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - frontend
    networks:
      - hireai_network

volumes:
  postgres_data:
  minio_data:

networks:
  hireai_network:
    driver: bridge
