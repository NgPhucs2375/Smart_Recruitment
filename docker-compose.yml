services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: smart_recruitment_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SuperStrongPassword123!}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smart_recruitment_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - kltn_network

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - kltn_network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: smart-recruitment-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    networks:
      - kltn_network

  minio:
    image: quay.io/minio/minio:latest
    container_name: smart-recruitment-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: smartadmin
      MINIO_ROOT_PASSWORD: SmartMinio@123456
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - kltn_network

  backend:
    build:
      context: .
      dockerfile: src/WebApi/WebApp.Server/Dockerfile.dev
    container_name: backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      DOTNET_USE_POLLING_FILE_WATCHER: "1"
      DOTNET_WATCH_SUPPRESS_LAUNCH_BROWSER: "1"
      DOTNET_WATCH_RESTART_ON_RUDE_EDIT: "1"

      ConnectionStrings__PostgresConnection: Host=postgres;Port=5432;Database=smart_recruitment_db;Username=postgres;Password=${POSTGRES_PASSWORD:-SuperStrongPassword123!}
      JWTSettings__Key: ${JWT_KEY:-UmVjcnVpdG1lbnRTbWFydC1EZXZlbG9wbWVudC1KV1QtS2V5LTIwMjYtQ2hhbmdlLU1l}
      JWTSettings__Issuer: ${JWT_ISSUER:-Identity}
      JWTSettings__Audience: ${JWT_AUDIENCE:-IdentityUser}
      JWTSettings__DurationInMinutes: ${JWT_DURATION:-60}

      RabbitMq__HostName: rabbitmq
      RabbitMq__UserName: guest
      RabbitMq__Password: guest
      RabbitMq__Port: "5672"
      RabbitMq__VHost: ""

      ConnectionStrings__Redis: redis:6379,abortConnect=false

      GROQ_API_KEY: ${GROQ_API_KEY:-dev-placeholder}

      # 9Router chạy ngoài compose (network bridge), backend ở kltn_network nên
      # localhost:20128 trong container != host. Dùng host-gateway để tới 9Router.
      # 9Router is an external container joined to proj_cv_kltn_network.
      Ai__Endpoint: http://9router:20128/v1
      Ai__Model: gemini/gemini-2.5-flash-lite
      # Ahihi

      Minio__Endpoint: minio:9000
      Minio__PublicEndpoint: localhost:9000
      Minio__AccessKey: smartadmin
      Minio__SecretKey: SmartMinio@123456
      Minio__BucketName: smart-recruitment-files
      Minio__UseSSL: "false"

    ports:
      - "${BACKEND_PORT:-8000}:8080"
    volumes:
      # Source remains on Windows; build artifacts stay inside the container
      # at /artifacts via dotnet watch --artifacts-path.
      - .:/workspace
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      minio:
        condition: service_started
    networks:
      - kltn_network

  frontend:
    build:
      context: ./src/WebApi/frontend
      dockerfile: Dockerfile.dev
    container_name: frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3001}:3000"
    environment:
      DOTNET_API_URL: http://backend:8080
      DOTNET_AGENT_URL: http://backend:8080/api/copilotkit
      NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_PORT:-8000}
      NEXT_PUBLIC_COPILOT_AGENT_URL: http://localhost:${BACKEND_PORT:-8000}
      # Chặn Turbopack/Node phình bộ nhớ làm host cạn RAM (trước đây gây
      # "Out of memory (os error 12)" -> module resolve lỗi ngẫu nhiên -> 500).
      NODE_OPTIONS: --max-old-space-size=2048
      # Docker Desktop bind mounts do not always emit native Linux file events.
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - ./src/WebApi/frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next_cache:/app/.next
    depends_on:
      - backend
    networks:
      - kltn_network

networks:
  kltn_network:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
  frontend_node_modules:
  frontend_next_cache:
