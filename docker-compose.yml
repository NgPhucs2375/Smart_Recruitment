services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: smart_recruitment_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SuperStrongPassword123!}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smart_recruitment_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - kltn_network

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - kltn_network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - kltn_network

  backend:
    build:
      context: .
      dockerfile: src/WebApi/WebApp.Server/Dockerfile
    container_name: backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__PostgresConnection: Host=postgres;Port=5432;Database=smart_recruitment_db;Username=postgres;Password=${POSTGRES_PASSWORD:-SuperStrongPassword123!}
      RabbitMq__HostName: rabbitmq
      RabbitMq__UserName: guest
      RabbitMq__Password: guest
      RabbitMq__Port: "5672"
      RabbitMq__VHost: ""
      GROQ_API_KEY: ${GROQ_API_KEY:-dev-placeholder}
      SmartAgent__Url: http://ai_agent:8080
    ports:
      - "${BACKEND_PORT:-5000}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - kltn_network

  ai_agent:
    build:
      context: ./smart/agent
      dockerfile: Dockerfile
    container_name: ai_agent
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      GitHubToken: ${GITHUB_TOKEN:-dev-placeholder}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://models.inference.ai.azure.com}
    ports:
      - "${AGENT_PORT:-8000}:8080"
    networks:
      - kltn_network

  frontend:
    build:
      context: ./src/WebApi/frontend
      dockerfile: Dockerfile.dev
    container_name: frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_PORT:-5000}
      NEXT_PUBLIC_COPILOT_AGENT_URL: http://localhost:${AGENT_PORT:-8000}
    volumes:
      - ./src/WebApi/frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
      - ai_agent
    networks:
      - kltn_network

networks:
  kltn_network:
    driver: bridge

volumes:
  postgres_data:
  frontend_node_modules:
