version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: smart_recruitment_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: SuperStrongPassword123!
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - kltn_network

  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - kltn_network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - kltn_network

  backend:
    build:
      context: .
      dockerfile: src/WebApi/WebApp.Server/Dockerfile
    container_name: backend
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=KLTN;Username=postgres;Password=SuperStrongPassword123!
      - RedisSettings__ConnectionString=redis:6379
      - RabbitMqSettings__HostName=rabbitmq
      - SmartAgent__Url=http://smart_agent:8080
      - GROQ_API_KEY=Sau_co_env_t_cau_hinh_lai
    ports:
      - "5000:8080"
    depends_on:
      - postgres
      - redis
      - rabbitmq
    networks:
      - kltn_network

  smart_agent:
    build:
      context: ./smart/agent
      dockerfile: Dockerfile
    container_name: smart_recruitment_ai_agent
    ports:
      - "5001:8080"
    networks:
      - kltn_network

  frontend:
    build:
      context: ./src/WebApi/frontend
      dockerfile: Dockerfile.dev
    container_name: frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000
      - NEXT_PUBLIC_COPILOT_AGENT_URL=http://localhost:5001
    volumes:
      - ./src/WebApi/frontend:/app
      - /app/node_modules
    depends_on:
      - backend
      - smart_agent
    networks:
      - kltn_network

networks:
  kltn_network:
    driver: bridge
volumes:
  postgres_data:
