services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: smart_recruitment_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SuperStrongPassword123!}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smart_recruitment_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - kltn_network

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - kltn_network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: smart-recruitment-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    networks:
      - kltn_network

  minio:
    # Local S3-compatible storage. The MinIO SDK used by the backend works with RustFS.
    image: rustfs/rustfs:latest
    container_name: smart-recruitment-minio
    restart: unless-stopped
    depends_on:
      minio-volume-permission:
        condition: service_completed_successfully
    environment:
      RUSTFS_VOLUMES: /data/rustfs{0...3}
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${MINIO_ACCESS_KEY:-smartadmin}
      RUSTFS_SECRET_KEY: ${MINIO_SECRET_KEY:-SmartMinio@123456}
      RUSTFS_OBS_LOGGER_LEVEL: info
      # Docker Desktop exposes every named volume on one virtual disk. This is
      # acceptable only for the single-host development compose, never production.
      RUSTFS_UNSAFE_BYPASS_DISK_CHECK: "true"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs_data_0:/data/rustfs0
      - rustfs_data_1:/data/rustfs1
      - rustfs_data_2:/data/rustfs2
      - rustfs_data_3:/data/rustfs3
      - rustfs_logs:/app/logs
    networks:
      - kltn_network

  minio-volume-permission:
    image: alpine:3.22
    restart: "no"
    volumes:
      - rustfs_data_0:/data0
      - rustfs_data_1:/data1
      - rustfs_data_2:/data2
      - rustfs_data_3:/data3
      - rustfs_logs:/logs
    command: >
      sh -c "chown -R 10001:10001 /data0 /data1 /data2 /data3 /logs &&
      echo 'RustFS volume permissions fixed'"
    networks:
      - kltn_network

  minio-init:
    image: amazon/aws-cli:2.37.7
    restart: "no"
    depends_on:
      minio:
        condition: service_started
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:-smartadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:-SmartMinio@123456}
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-smart-recruitment-files}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        for attempt in $(seq 1 30); do
          if aws s3api head-bucket --bucket "$${MINIO_BUCKET_NAME}" --endpoint-url http://minio:9000 >/dev/null 2>&1; then
            echo "Object-storage bucket is ready: $${MINIO_BUCKET_NAME}"
            exit 0
          fi
          if aws s3api create-bucket --bucket "$${MINIO_BUCKET_NAME}" --endpoint-url http://minio:9000 >/dev/null 2>&1; then
            echo "Created object-storage bucket: $${MINIO_BUCKET_NAME}"
            exit 0
          fi
          sleep 2
        done
        echo "Could not connect to object storage or create bucket: $${MINIO_BUCKET_NAME}" >&2
        exit 1
    networks:
      - kltn_network

  backend:
    build:
      context: .
      dockerfile: src/WebApi/WebApp.Server/Dockerfile.dev
    container_name: backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      DOTNET_USE_POLLING_FILE_WATCHER: "1"
      DOTNET_WATCH_SUPPRESS_LAUNCH_BROWSER: "1"
      DOTNET_WATCH_RESTART_ON_RUDE_EDIT: "1"

      ConnectionStrings__PostgresConnection: Host=postgres;Port=5432;Database=smart_recruitment_db;Username=postgres;Password=${POSTGRES_PASSWORD:-SuperStrongPassword123!}
      JWTSettings__Key: ${JWT_KEY:-UmVjcnVpdG1lbnRTbWFydC1EZXZlbG9wbWVudC1KV1QtS2V5LTIwMjYtQ2hhbmdlLU1l}
      JWTSettings__Issuer: ${JWT_ISSUER:-Identity}
      JWTSettings__Audience: ${JWT_AUDIENCE:-IdentityUser}
      JWTSettings__DurationInMinutes: ${JWT_DURATION:-60}

      RabbitMq__HostName: rabbitmq
      RabbitMq__UserName: guest
      RabbitMq__Password: guest
      RabbitMq__Port: "5672"
      RabbitMq__VHost: ""

      ConnectionStrings__Redis: redis:6379,abortConnect=false

      GROQ_API_KEY: ${GROQ_API_KEY:-dev-placeholder}

      # 9Router chạy ngoài compose (network bridge), backend ở kltn_network nên
      # localhost:20128 trong container != host. Dùng host-gateway để tới 9Router.
      # 9Router is an external container joined to proj_cv_kltn_network.
      Ai__Endpoint: http://9router:20128/v1
      Ai__Model: gemini/gemini-2.5-flash-lite
      # Ahihi

      Minio__Endpoint: minio:9000
      Minio__PublicEndpoint: localhost:9000
      Minio__AccessKey: ${MINIO_ACCESS_KEY:-smartadmin}
      Minio__SecretKey: ${MINIO_SECRET_KEY:-SmartMinio@123456}
      Minio__BucketName: ${MINIO_BUCKET_NAME:-smart-recruitment-files}
      Minio__UseSSL: "false"

    ports:
      - "${BACKEND_PORT:-8000}:8080"
    volumes:
      # Source remains on Windows; build artifacts stay inside the container
      # at /artifacts via dotnet watch --artifacts-path.
      - .:/workspace
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    networks:
      - kltn_network

  frontend:
    build:
      context: ./src/WebApi/frontend
      dockerfile: Dockerfile.dev
    container_name: frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3001}:3000"
    environment:
      DOTNET_API_URL: http://backend:8080
      DOTNET_AGENT_URL: http://backend:8080/api/copilotkit
      NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_PORT:-8000}
      NEXT_PUBLIC_COPILOT_AGENT_URL: http://localhost:${BACKEND_PORT:-8000}
      # Chặn Turbopack/Node phình bộ nhớ làm host cạn RAM (trước đây gây
      # "Out of memory (os error 12)" -> module resolve lỗi ngẫu nhiên -> 500).
      NODE_OPTIONS: --max-old-space-size=2048
      # Docker Desktop bind mounts do not always emit native Linux file events.
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - ./src/WebApi/frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next_cache:/app/.next
    depends_on:
      - backend
    networks:
      - kltn_network

networks:
  kltn_network:
    driver: bridge

volumes:
  postgres_data:
  # Legacy MinIO volume retained so any existing local objects are not removed.
  minio_data:
  rustfs_data_0:
  rustfs_data_1:
  rustfs_data_2:
  rustfs_data_3:
  rustfs_logs:
  frontend_node_modules:
  frontend_next_cache:
