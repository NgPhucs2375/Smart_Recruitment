# HireAI Nginx Gateway — GCP VM (Docker Compose).
# Vai trò: reverse proxy + TLS endpoint (sau này) + gzip + upload limit.
# Kiến trúc: MỌI request -> frontend:3000 (Next standalone). Frontend gọi
# backend cùng origin qua /api/dotnet/* (Route Handler proxy server-side
# tới DOTNET_API_URL=http://backend:8080). KHÔNG tách /api/ ra backend —
# route Next sẽ gãy. MinIO đi cổng 9000 trực tiếp (presigned URL ký theo
# path, rewrite sẽ vỡ chữ ký) — xem deploy/README.md.
#
# Certbot (khi có domain): certbot certonly --webroot -w /var/www/certbot
#   -d <domain> rồi mount certs + bật block 443 bên dưới.

upstream frontend {
    server frontend:3000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# Giữ sẵn upstream backend cho healthcheck trực tiếp / debug nội bộ.
# upstream backend {
#     server backend:8080 max_fails=3 fail_timeout=30s;
# }

# Giới hạn upload toàn cục (avatar / CV PDF / preview ảnh).
client_max_body_size 25M;

# Nén gzip cho text assets.
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types
    text/plain text/css text/xml application/json
    application/javascript application/xml+rss
    image/svg+xml font/ttf font/otf font/woff font/woff2;

# Timeouts: AI matching / xuất PDF có thể chạy lâu.
proxy_connect_timeout 10s;
proxy_send_timeout 120s;
proxy_read_timeout 120s;
send_timeout 120s;

# Map Upgrade header: chỉ WebSocket (SignalR) mới upgrade, request thường
# giữ keepalive bình thường (tránh set cứng Connection: upgrade mọi request).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # Certbot webroot challenge (khi gắn domain sau này).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SignalR/WebSocket đi qua frontend proxy (giữ handshake).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

