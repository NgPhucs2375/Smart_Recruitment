# HireAI Nginx Gateway — GCP VM (Docker Compose), domain hireais.dev.
# Vai trò: TLS endpoint (Let’s Encrypt) + reverse proxy + ép HTTP/www về HTTPS.
# Kiến trúc: MỌI request ứng dụng -> frontend:3000 (Next standalone). Frontend gọi
# backend cùng origin qua /api/dotnet/* (Route Handler proxy server-side tới
# DOTNET_API_URL=http://backend:8080). KHÔNG tách /api/ ra backend — route Next sẽ gãy.
#
# Vì sao presigned URL đi qua nginx: MinIO SDK ký SigV4 theo Host + path, nên trình
# duyệt phải mở đúng https://hireais.dev/<bucket>/<object>?X-Amz-*. Cổng 9000 không
# mở ra internet (firewall GCP chỉ cho 80/443), vì vậy location ^~ /<bucket>/ dưới đây
# forward NGUYÊN URI + Host: hireais.dev sang minio:9000 — chữ ký vẫn hợp lệ.
# Đổi Minio__BucketName thì phải đổi prefix location tương ứng.
#
# Certbot: certbot certonly --webroot -w /var/www/certbot -d hireais.dev -d www.hireais.dev
#   renew: certbot renew --deploy-hook 'docker compose -f docker-compose.prod.yml exec -T nginx nginx -s reload'

upstream frontend {
    server frontend:3000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# Object storage nội bộ, chỉ nginx mới được phép chạm tới.
upstream minio {
    server minio:9000;
    keepalive 8;
}

# Giới hạn upload toàn cục (avatar / CV PDF / preview ảnh).
client_max_body_size 25M;

# Nén gzip cho text assets.
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types
    text/plain text/css text/xml application/json
    application/javascript application/xml+rss
    image/svg+xml font/ttf font/otf font/woff font/woff2;

# Timeouts: AI matching / xuất PDF có thể chạy lâu.
proxy_connect_timeout 10s;
proxy_send_timeout 120s;
proxy_read_timeout 120s;
send_timeout 120s;

# Map Upgrade header: chỉ WebSocket (SignalR) mới upgrade, request thường
# giữ keepalive bình thường (tránh set cứng Connection: upgrade mọi request).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name hireais.dev www.hireais.dev;

    # ACME HTTP-01 challenge cho certbot renew.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Health check cho bước nghiệm thu trong .github/workflows/deploy.yml
    # (curl -fsS http://localhost/health/live). Path này 404 trên Next nên CI rơi về
    # vế sau của ||; nếu để nó bị 301 thì curl -f vẫn coi là thành công và deploy
    # báo OK kể cả khi frontend chết.
    location = /health/live {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Còn lại ép lên HTTPS: nếu để http:// chạy được, trình duyệt gửi Origin
    # http://hireais.dev và backend từ chối (không nằm trong FRONTEND_ALLOWED_ORIGINS).
    location / {
        return 301 https://hireais.dev$request_uri;
    }
}

# www -> apex (cert hireais.dev có SAN www.hireais.dev nên dùng chung file).
server {
    listen 443 ssl;
    http2 on;
    server_name www.hireais.dev;

    ssl_certificate /etc/letsencrypt/live/hireais.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hireais.dev/privkey.pem;

    return 301 https://hireais.dev$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name hireais.dev;

    ssl_certificate /etc/letsencrypt/live/hireais.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hireais.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 25M;

    # Presigned URL của bucket file (CV, banner). proxy_pass không có phần URI
    # => giữ nguyên path + query string; Host đặt theo tên miền công khai vì
    # SigV4 đã ký Host: hireais.dev.
    location ^~ /smart-recruitment-files/ {
        proxy_pass http://minio;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        access_log off;
    }

    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SignalR/WebSocket đi qua frontend proxy (giữ handshake).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
