<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b1220; font-family: system-ui, "Segoe UI", sans-serif; }
  .badge { transition: transform .15s ease; transform-box: fill-box; transform-origin: center; }
  svg text { user-select: none; }
</style>
</head>
<body>
<svg id="map" viewBox="0 0 400 780" width="440" height="858"></svg>
<script>
const OUTLINE = "M 96 74 L 124 62 L 148 58 L 166 46 L 186 42 L 204 30 L 220 36 L 232 54 L 246 46 L 262 64 L 280 76 L 294 94 L 302 112 L 304 130 L 296 146 L 288 162 L 270 176 L 258 190 L 248 208 L 240 236 L 246 266 L 254 292 L 268 316 L 280 340 L 288 366 L 286 394 L 278 420 L 270 448 L 260 476 L 250 504 L 238 532 L 224 558 L 206 574 L 188 588 L 174 606 L 166 628 L 158 654 L 150 680 L 136 702 L 112 714 L 88 720 L 78 696 L 72 664 L 64 628 L 58 600 L 88 578 L 114 560 L 136 542 L 148 516 L 170 492 L 184 464 L 178 434 L 184 404 L 176 372 L 162 344 L 148 318 L 136 292 L 126 262 L 112 236 L 96 206 L 86 172 L 92 132 L 80 106 Z";

const REGIONS = [
  { id: "mien-nui-bac", name: "Trung du & miền núi phía Bắc", count: 128,
    d: "M 40 16 L 344 16 L 344 238 L 40 252 Z",
    badge: [185, 92], labels: [{ x: 185, y: 124, text: "Trung du & Miền núi phía Bắc" }] },
  { id: "dong-bang-song-hong", name: "Đồng bằng sông Hồng", count: 356,
    d: "M 156 154 C 205 138 258 140 306 142 L 306 180 L 252 214 L 174 200 Z",
    badge: [240, 170], labels: [{ x: 222, y: 196, text: "Đồng bằng" }, { x: 222, y: 208, text: "sông Hồng" }] },
  { id: "bac-trung-bo", name: "Bắc Trung Bộ", count: 98,
    d: "M 40 208 C 120 218 200 202 340 214 L 340 224 L 296 352 C 230 342 190 352 148 346 Z",
    badge: [200, 276], labels: [{ x: 200, y: 304, text: "Bắc Trung Bộ" }] },
  { id: "nam-trung-bo", name: "Nam Trung Bộ", count: 87,
    d: "M 40 330 C 120 336 220 328 340 342 L 344 584 L 150 590 L 36 420 Z",
    badge: [253, 432], labels: [] },
  { id: "tay-nguyen", name: "Tây Nguyên", count: 64,
    d: "M 124 344 C 190 370 240 424 238 474 C 236 506 192 522 138 538 L 116 440 Z",
    badge: [198, 440], labels: [] },
  { id: "dong-nam-bo", name: "Đông Nam Bộ", count: 412,
    d: "M 128 474 C 178 486 224 486 258 478 L 240 520 L 216 560 L 208 588 L 168 624 L 124 550 Z",
    badge: [192, 534], labels: [{ x: 192, y: 510, text: "Đông Nam Bộ" }] },
  { id: "dong-bang-song-cuu-long", name: "Đồng bằng sông Cửu Long", count: 143,
    d: "M 20 522 L 120 530 L 168 566 L 196 616 L 176 656 L 150 692 L 118 722 L 86 728 L 20 728 Z",
    badge: [102, 646], labels: [{ x: 104, y: 672, text: "Đồng bằng" }, { x: 104, y: 685, text: "sông Cửu Long" }] },
];

const MIN = Math.min(...REGIONS.map(r => r.count));
const MAX = Math.max(...REGIONS.map(r => r.count));

function tOf(count) { return (count - MIN) / (MAX - MIN); }
function colorFor(count) {
  const t = tOf(count);
  const h = 174 + (222 - 174) * t;
  const s = 62 + 10 * t;
  const l = 92 - 54 * t;
  return `hsl(${h.toFixed(1)} ${s.toFixed(1)}% ${l.toFixed(1)}%)`;
}

const svg = document.getElementById("map");
const NS = "http://www.w3.org/2000/svg";
function el(name, attrs, parent) {
  const e = document.createElementNS(NS, name);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  (parent || svg).appendChild(e);
  return e;
}

const defs = el("defs", {});
const clip = el("clipPath", { id: "vn-clip" }, defs);
el("path", { d: OUTLINE }, clip);
const filter = el("filter", { id: "map-shadow", x: "-30%", y: "-20%", width: "160%", height: "150%" }, defs);
el("feDropShadow", { dx: "0", dy: "10", stdDeviation: "10", "flood-color": "#000", "flood-opacity": "0.45" }, filter);

const g = el("g", { "clip-path": "url(#vn-clip)", filter: "url(#map-shadow)" });
el("path", { d: OUTLINE, fill: "#94a3b8" }, g); // base
for (const r of REGIONS) {
  el("path", { d: r.d, fill: colorFor(r.count), stroke: "rgba(255,255,255,0.35)", "stroke-width": 0.6, "data-id": r.id }, g);
}
el("path", { d: OUTLINE, fill: "none", stroke: "#1e293b", "stroke-width": 1.4, "stroke-linejoin": "round" });

for (const r of REGIONS) {
  const c = colorFor(r.count);
  const darkText = tOf(r.count) < 0.45;
  for (const L of r.labels) {
    const t = el("text", {
      x: L.x, y: L.y, "text-anchor": "middle",
      "font-size": 11, "font-weight": 700, fill: darkText ? "#0f172a" : "#ffffff",
      stroke: darkText ? "rgba(255,255,255,0.85)" : "rgba(15,23,42,0.55)",
      "stroke-width": 2.6, "paint-order": "stroke", "stroke-linejoin": "round",
      "font-family": "system-ui, 'Segoe UI', sans-serif",
    });
    if (L.rotate) t.setAttribute("transform", `rotate(${L.rotate} ${L.x} ${L.y})`);
    t.textContent = L.text;
  }
  const b = el("g", { class: "badge", "data-id": r.id });
  el("circle", { cx: r.badge[0], cy: r.badge[1], r: 15, fill: "#ffffff", stroke: c, "stroke-width": 2.5 }, b);
  const n = el("text", {
    x: r.badge[0], y: r.badge[1] + 4.5, "text-anchor": "middle",
    "font-size": 12.5, "font-weight": 800, fill: "#0f172a",
    "font-family": "system-ui, 'Segoe UI', sans-serif",
  }, b);
  n.textContent = r.count;
}
</script>
</body>
</html>
